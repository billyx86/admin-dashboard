name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: HTML sanity & a11y checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validator
        run: npm test
